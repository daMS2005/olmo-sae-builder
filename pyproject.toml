[project]
name = "sparse_autoencoder"
description = "Readable OLMo-3-7B-Think sparse autoencoder training pipeline"
version = "0.1"
authors = [{name = "Daniel Mora"}]
dependencies = [
    "huggingface_hub",
    "pyarrow",
    "torch",
    "transformers",
]
readme = "README.md"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sparse_autoencoder*"]
